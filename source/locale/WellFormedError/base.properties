REFERENCE_NO_DECLARATION = Missing declaration for entity "{0}".
PEREF_INVALID_ENTITYVALUE_CONTEXT = Must not have a parameter entity reference in an entity value in the internal subset. Found "{0}".
CHARREF_XTRA_SPACE = Must not have a space after the "#" in a character reference.
