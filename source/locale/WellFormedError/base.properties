REFERENCE_NO_NAME = Missing name in entity reference.
REFERENCE_NO_SEMICOLON = Missing semicolon after entity reference "{0}".
REFERENCE_XTRA_SPACE = Must not have space in the entity reference "{0}".
REFERENCE_XTRA_TRAILING_SPACE = Must not have a space after the entity reference "{0}".
