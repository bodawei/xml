# If a message goes out of use, we can't remove the key or the code.
# In that case, replace the message with the string OBSOLETE
# e.g. OLD_ID = OBSOLETE
# The processor will not deliver those to the app.

# FORMAT:
# THING(_SUBTHING)_PROBLEM = "THING must WHATEVER. Found OTHER"
# THING_NO_(whatever) = "Missing WHATEVER in a THING"
# THING_XTRA_... = "Must not ..."

NOUN_TEXTDECL = a Text Declaration
NOUN_XMLDECL = an XML Declaration
NOUN_EXTERNALID_SYSTEM = an ExternalID
NOUN_ENTITYVALUE = an entity literal value
NOUN_XMLDECL_PARAM = a parameter to an XML Declaration
CHARSET_UTF16_NO_BOM = Missing BOM in UTF-16 input.
XMLDECL_NO_ATTRIBUTES = Missing version in an Xml Declaration.
XMLDECL_NO_CLOSE = Missing closing "?>" in an XML or Text Declaration.
XMLDECL_ATTR_INVALID_CASE = "{0}" must be lower case. Found "{1}".
XMLDECL_ATTR_UNKNOWN = Unknown XML Declaration parameter "{0}".
XMLDECL_TARGET_INVALID_CASE = "xml" must be lower case. Found "{0}".
XMLDECL_VERSION_INVALD = "version" must be "1.0" or "1.1". Found "{0}".
XMLDECL_VERSION_INVALID_ORDER = "version" must be the first attribute. Found as #{0}.
XMLDECL_ENCODING_INVALID = "encoding" must be alphanumeric. Found "{0}".
XMLDECL_ENCODING_INVALID_ORDER = "encoding" must be after "version" and before "standalone".
XMLDECL_STANDALONE_INVALID_CASE = "{0}" must be lower case. Found "{1}".
XMLDECL_STANDALONE_INVALID = "standalone" must be "yes" or "no". Found "{0}".
XMLDECL_STANDALONE_INVALID_ORDER = "standalone" must come after "version".
XMLDECL_INVALID_CONTEXT = An XML or Text Declaration must be the first thing in the entity.
TEXTDECL_XTRA_STANDALONE = "standalone" must not be in a Text Declaration.
TEXTDECL_NO_ENCODING = "encoding" must be in a Text Declaration.
TEXTDECL_NO_ATTRIBUTES = Missing version in a Text Declaration.

PI_SPACE_AFTER_OPEN = Must not have a space before the target ("{0}") name.
PI_NO_TARGET = Missing target name in a processing instruction.
PI_NO_SPACE_AFTER_TARGET = Must not have a space after the target name ("{0}").
PI_NO_CLOSE = Missing closing ?> in a processing instruction for the target "{0}".
PI_INVALID_CONTEXT = A processing instruction must not be the first thing in the document entity.

COMMENT_NO_CLOSE = Missing closing --> in a comment.
COMMENT_ENDS_WITH_HYPHEN = Must not have a hyphen at end of a comment.
COMMENT_INVALID_CONTEXT = A comment must not be the first thing in the document entity.
ELEMENT_UNBALANCED = Expected end tag "{0}". Found "{1}".
ELEMENT_XTRA_LEADING_SPACE = Must not have space after opening "<" of an element tag.
ELEMENT_NO_NAME = Missing name in element tag.
ELEMENT_NAME_INVALID = The element tag name must match the syntax for names. Found: "{0}".
ELEMENT_NO_CLOSE = Missing closing of element tag.
ELEMENT_END_INVALID_CLOSE = End element tag must close with ">". Found "/>".
ELEMENT_INVALID_DOC_CONTEXT = An element must not be before the Xml Declaration. Found "{0}".
ELEMENT_INVALID_DTD_CONTEXT = An element must not be in the internal or external subset. Found "{0}".
ATTRIBUTE_INVALID_NAME = The attribute name must match the syntax for names. Found: "{0}".
ATTRIBUTE_NO_SPACE_BEFORE_NAME = "{0}" must have a space before it.
ATTRIBUTE_NO_EQUAL = "{0}" must be followed by an "=".
ATTRIBUTE_NO_VALUE = "{0}" must have a value.
ATTRIBUTE_NO_QUOTE = The value for "{0}" must be quoted.
ATTRIBUTE_NO_CLOSE_QUOTE = The value for "{0}" must close with a quote.
ATTRIBUTE_INVALID_VALUE = The value of attribute "{0}" must not contain "<".
SPACE_INVALID_CONTEXT = The XML Declaration must appear before any content in the document entity.
CHARDATA_INVALID_TEXT = "]]>" must not appear in in character data.
CHARDATA_INVALID_SUBSET_CONTEXT = CharData must not be in the external subset. Found "{0}".
CHARDATA_INVALID_DOC_CONTEXT = CharData must not be outside the content of the document entity. Found "{0}".
CHARDATA_INVALID_CHAR = Characters that do not match the syntax for XML document found at: {0}.
CDATA_INVALID_CASE = "CDATA" must be capitalized. Found "{0}".
