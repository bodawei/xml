# If a message goes out of use, we can't remove the key or the code.
# In that case, replace the message with the string OBSOLETE
# e.g. OLD_ID = OBSOLETE
# The processor will not deliver those to the app.

# FORMAT:
# THING(_SUBTHING)_PROBLEM = "THING must WHATEVER. Found OTHER"
# THING_NO_(whatever) = "Missing WHATEVER in a THING"
# THING_XTRA_... = "Must not ..."

ELEMENT_EXTRA_DECLARATION = There must be only one declaration for a particular element type. Found multiple for "{0}"
MISMATCH_ROOT_ELEMENT_TYPE = The name ("{0}") in the document type declaration must match the element type of the root element. Found ("{1}").
NOTATION_NOT_UNIQUE = A notation named "{0}" was already declared.

CONTENT_IN_EMPTY_ELEMENT = Found content in an element that should be empty ("{0}"). 
UNDECLARED_ELEMENT_IN_MIXED = Found an element that was not declared in a "{0}" element type. Found "{1}".
MIXED_XTRA_MARKUP = Found markup that is not permitted in the content of an element of type "{0}".
INVALID_ELEMENT_IN_CONTENT = Found an element type, "{1}" in an "{0}" elment at a position it is not allowed.

ELEMENTSTART_UNDECLARED_ATTRIBUTE = Found an attribute "{1}" for element "{0}" that was not declared.
ELEMENTSTART_ID_DUPLICATE = The ID value "{0}" must only be used once in a document. Found on attribute "{2}" of element type "{1}" when earlier used on attribute "{4}" of element type "{3}".
ELEMENTSTART_ID_NAME_INVALID = The ID value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_IDREF_NOT_NAME = The IDREF value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_IDREFS_NOT_NAME = The IDREFS value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".

ATTLISTDECL_ID_BAD_DEFAULT = The default type for attribute "{1}" of attribute list declaration "{0}" must be "#IMPLIED" or "#REQUIRED". Found "{2}".
ATTLISTDECL_EXTRA_ID = Must not have more than one attribute of type ID for the element type "{0}". Found "{1}"
ELEMENTDECL_MIXED_DUPLICATE_NAME = The Mixed content spec for element declaration "{0}" had multiple declarations of the elment type "{1}".

ANY_XTRA_COMMENT = Found a comment in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_PI = Found a processingInstruction in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_CDATA = Found a CDATA section in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_MARKUP = Found markup that is not permitted in the content of an element of type "{0}".
ANY_UNDECLARED_ELEMENT = Undeclared elment found in an "{0}" element type that was not declared. Found "{1}".

CHILDREN_XTRA_COMMENT = Found a comment in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_XTRA_PI = Found a processingInstruction in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_XTRA_CONTENT = Found markup or characters in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_UNEXPECTED_END = Found the end of element type "{0}", but expected other elements (any of: {1}).