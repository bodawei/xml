# If a message goes out of use, we can't remove the key or the code.
# In that case, replace the message with the string OBSOLETE
# e.g. OLD_ID = OBSOLETE
# The processor will not deliver those to the app.

# FORMAT:
# THING(_SUBTHING)_PROBLEM = "THING must WHATEVER. Found OTHER"
# THING_NO_(whatever) = "Missing WHATEVER in a THING"
# THING_XTRA_... = "Must not ..."

ELEMENT_EXTRA_DECLARATION = There must be only one declaration for a particular element type. Found multiple for "{0}"
MISMATCH_ROOT_ELEMENT_TYPE = The name ("{0}") in the document type declaration must match the element type of the root element. Found ("{1}").
NOTATION_NOT_UNIQUE = A notation named "{0}" was already declared.

CONTENT_IN_EMPTY_ELEMENT = Found content in an element that should be empty ("{0}"). 
UNDECLARED_ELEMENT_IN_MIXED = Found an element that was not declared in a "{0}" element type. Found "{1}".
MIXED_XTRA_COMMENT_PI = Found a {1} in the content of an element of type "{0}".

ELEMENTSTART_UNDECLARED_ATTRIBUTE = Found an attribute "{1}" for element "{0}" that was not declared.

ATTLISTDECL_ID_BAD_DEFAULT = The default type for attribute "{1}" of attribute list declaration "{0}" must be "#IMPLIED" or "#REQUIRED". Found "{2}".
ELEMENTDECL_MIXED_DUPLICATE_NAME = The Mixed content spec for element declaration "{0}" had multiple declarations of the elment type "{1}".
