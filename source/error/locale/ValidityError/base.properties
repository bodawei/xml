# If a message goes out of use, we can't remove the key or the code.
# In that case, replace the message with the string OBSOLETE
# e.g. OLD_ID = OBSOLETE
# The processor will not deliver those to the app.

# FORMAT:
# THING(_SUBTHING)_PROBLEM = "THING must WHATEVER. Found OTHER"
# THING_NO_(whatever) = "Missing WHATEVER in a THING"
# THING_XTRA_... = "Must not ..."

ELEMENT_EXTRA_DECLARATION = There must be only one declaration for a particular element type. Found multiple for "{0}"
MISMATCH_ROOT_ELEMENT_TYPE = The name ("{0}") in the document type declaration must match the element type of the root element. Found ("{1}").
NOTATION_NOT_UNIQUE = A notation named "{0}" was already declared.

CONTENT_IN_EMPTY_ELEMENT = Found content in an element that should be empty ("{0}"). 
UNDECLARED_ELEMENT_IN_MIXED = Found an element that was not declared in a "{0}" element type. Found "{1}".
MIXED_XTRA_MARKUP = Found markup that is not permitted in the content of an element of type "{0}".
INVALID_ELEMENT_IN_CONTENT = Found an element type, "{1}" in an "{0}" elment at a position it is not allowed.

ELEMENTSTART_UNDECLARED_ATTRIBUTE = Found an attribute "{1}" for element "{0}" that was not declared.
ELEMENTSTART_ID_DUPLICATE = The ID value "{0}" must only be used once in a document. Found on attribute "{2}" of element type "{1}" when earlier used on attribute "{4}" of element type "{3}".
ELEMENTSTART_ID_NAME_INVALID = The ID value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_IDREF_NOT_NAME = The IDREF value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_IDREFS_NOT_NAME = The IDREFS value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_ENTITY_NOT_NAME = The ENTITY value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_ENTITIES_NOT_NAME = The ENTITIES value for attribute "{2}" of element "{1}" must match the syntax for names. Found "{0}".
ELEMENTSTART_ENTITY_NO_ENTITY = The ENTITY value for attribute "{2}" of element "{1}" must name a declared entity. Found "{0}".
ELEMENTSTART_ENTITY_PARSED_ENTITY =  The ENTITY value for attribute "{2}" of element "{1}" must name an unparsed declared entity. Found "{0}".
ELEMENTSTART_ENTITIES_NO_ENTITY = The ENTITIES value for attribute "{2}" of element "{1}" names one or more entities that were not declared. These are: "{0}".
ELEMENTSTART_ENTITIES_PARSED_ENTITY = The ENTITIES value for attribute "{2}" of element "{1}" names one or more parsed entities. These are: "{0}".
ELEMENTSTART_NMTOKEN_NOT_NMTOKEN = The NMTOKEN value for attribute "{2}" of element "{1}" must match the syntax for a name token. Found: "{0}".
ELEMENTSTART_NMTOKENS_NOT_NMTOKEN = The NMTOKENS value for attribute "{2}" of element "{1}" must match the syntax for name tokens. Found: "{0}".
ELEMENTSTART_NOTATION_NOT_DECLARED = The NOTATION value for attribute "{2}" of element "{1}" must be one of the values declared ({3}). Found: "{0}".
ELEMENTSTART_ENUMERATION_NOT_DECLARED = The enumeration value for attribute "{2}" of element "{1}" must be one of the values declared ({3}). Found: "{0}".
ELEMENTSTART_IDREF_NO_ID = The attribute "{2}" of element "{1}" refers to an ID that is not in the document. Found: "{0}".
ELEMENTSTART_NO_REQUIRED = The required attribute "{1}" missing on element "{0}".
ELEMENTSTART_FIXED_NOT_RIGHT = The #FIXED attribute "{1}" on element "{0}" has the wrong value. Expected "{2}". Found "{3}".

ATTLISTDECL_ID_BAD_DEFAULT = The default type for attribute "{1}" of attribute list declaration "{0}" must be "#IMPLIED" or "#REQUIRED". Found "{2}".
ATTLISTDECL_EXTRA_ID = Must not have more than one attribute of type ID for the element type "{0}". Found "{1}"
ATTLISTDECL_EXTRA_NOTATION = Must not have more than one attribute of type NOTATION for the element type "{0}". Found "{1}"
ATTLISTDECL_BAD_NOTATION = The attribute "{1}" of attribute list declaration "{0}" must name NOTATIONs that have been declared. Found "{2}".
ATTLISTDECL_EMPTY_NOTATION = Must not have an attribute of type NOTATION on an EMPTY element "{0}". Found "{1}"
ATTLISTDECL_DUPLICATE_NOTATION = Must not have duplicate NOTATION values on the "{1}" attribute of element "{0}". Found "{2}"
ATTLISTDECL_DUPLICATE_ENUMERATION = Must not have duplicate enumeration values on the "{1}" attribute of element "{0}". Found "{2}"
ATTLISTDECL_BAD_NOTATION_DEFAULT = The default for the attribute "{1}" of attribute list declaration "{0}" must have one of these values: {2}. Found "{3}".
ATTLISTDECL_BAD_ENUMERATION_DEFAULT = The default for the attribute "{1}" of attribute list declaration "{0}" must have one of these values: {2}. Found "{3}".
ATTLISTDECL_BAD_ID_DEFAULT = The default for the ID attribute "{1}" of attribute list declaration "{0}" must match the syntax for names. Found "{2}".
ATTLISTDECL_BAD_IDREF_DEFAULT = The default for the IDREF attribute "{1}" of attribute list declaration "{0}" must match the syntax for names. Found "{2}".
ATTLISTDECL_BAD_IDREFS_DEFAULT = The names in the default for the IDREFS attribute "{1}" of attribute list declaration "{0}" must match the syntax for names. Found "{2}".
ATTLISTDECL_BAD_ENTITY_DEFAULT = The default for the ENTITY attribute "{1}" of attribute list declaration "{0}" must match the syntax for names. Found "{2}".
ATTLISTDECL_BAD_ENTITIES_DEFAULT = The names in the default for the ENTITIES attribute "{1}" of attribute list declaration "{0}" must match the syntax for names. Found "{2}".
ATTLISTDECL_BAD_NMTOKEN_DEFAULT = The default for the NMTOKEN attribute "{1}" of attribute list declaration "{0}" must match the syntax for name tokens. Found "{2}".
ATTLISTDECL_BAD_NMTOKENS_DEFAULT = The names in the default for the NMTOKENS attribute "{1}" of attribute list declaration "{0}" must match the syntax for name tokens. Found "{2}".
ATTLISTDECL_SPACE_BAD_TYPE = The "xml:space" attribute for "{0}" must have an enumeration value.
ATTLISTDECL_SPACE_BAD_CASE = The "xml:space" attribute for "{0}" must be lower case. Found: "{1}".
ATTLISTDECL_SPACE_MISSING_ENUMRATION = The "xml:space" attribute for "{0}" must have at least one of "default" and "preserve" as enumerated values.
ATTLISTDECL_SPACE_BAD_ENUMRATION = The "xml:space" attribute for "{0}" must have only "default" and/or "preserve" as values. Found "{1}".

ELEMENTDECL_MIXED_DUPLICATE_NAME = The Mixed content spec for element declaration "{0}" had multiple declarations of the elment type "{1}".
ELEMENTDECL_PEREF_PARENS_UNBALANCED = The replacement text for the parameter entity "{1}" was not properly nested in the element declaration "{0}"

ANY_XTRA_COMMENT = Found a comment in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_PI = Found a processingInstruction in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_CDATA = Found a CDATA section in the element type "{0}", which is not allowed there in XML {1}/{2}.
ANY_XTRA_MARKUP = Found markup that is not permitted in the content of an element of type "{0}".
ANY_UNDECLARED_ELEMENT = Undeclared elment found in an "{0}" element type that was not declared. Found "{1}".

CHILDREN_XTRA_COMMENT = Found a comment in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_XTRA_PI = Found a processingInstruction in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_XTRA_CONTENT = Found markup or characters in the element type "{0}", which is not allowed there in XML {1}/{2}.
CHILDREN_UNEXPECTED_END = Found the end of element type "{0}", but expected other elements (any of: {1}).