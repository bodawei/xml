name: CI

on:
   pull_request:

permissions:
   contents: read

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

jobs:
   checks:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 26
              cache: npm

         - run: npm ci

         # Each check runs even if an earlier one failed, so one run reports every problem.
         # The job still fails if any of them fails.

         # Non-fixing lint of the modules that are lint-clean today (see ROADMAP P5).
         # `npm run lint` is not used: it passes --fix and the rest of the tree has a
         # large pre-existing error baseline.
         - name: Lint
           if: ${{ !cancelled() }}
           run: npm run lint:ci

         - name: Type check
           if: ${{ !cancelled() }}
           run: npm run check:types

         - name: Jest
           if: ${{ !cancelled() }}
           run: npm run jest:all

         - name: Jasmine
           if: ${{ !cancelled() }}
           run: npm run test:jasmine
